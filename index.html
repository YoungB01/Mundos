<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundus — Codex de Personagens</title>
<style>
:root{--bg:#17141b;--panel:#29222d;--panel2:#211b25;--gold:#c5a265;--text:#eadfc9;--muted:#b8a78d;--wine:#67354a;--line:#594735}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{background:var(--wine);color:#fff;border:1px solid var(--gold);padding:9px 12px;border-radius:8px;cursor:pointer}button:hover{filter:brightness(1.12)}button.secondary{background:#39313e}button.danger{background:#702d35}.wrap{max-width:1200px;margin:auto;padding:16px}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:15px}.brand h1{margin:0;color:var(--gold);font:clamp(25px,4vw,38px) Georgia,serif}.brand small,.hint,small{color:var(--muted)}.actions,.nav,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.nav{margin:14px 0}.nav button{background:#332b38;border-color:#66543d}.nav button.active{background:var(--gold);color:#211b21;font-weight:700}.panel,.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0}.panel h2{margin:2px 0 13px;color:var(--gold);font:23px Georgia,serif}.panel h3,.card h3{color:#dfc38a;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select,.field textarea,input.search{width:100%;padding:9px;border-radius:7px;border:1px solid #65513e;background:#17141b;color:var(--text)}.stat strong{display:block;color:var(--gold);font-size:23px}.stat small{font-size:12px}.pill{display:inline-block;background:#4c3947;border-radius:20px;padding:3px 8px;margin:2px;font-size:12px;color:#e9d5a9}.list{max-height:520px;overflow:auto}.record{border:1px solid #5a4937;background:var(--panel2);padding:11px;border-radius:8px;margin:8px 0}.record p{margin:8px 0;color:#d4c5ae}.record .meta{font-size:12px;color:var(--muted)}.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px}.hide{display:none!important}.notice{border-left:3px solid var(--gold);padding:9px 12px;background:#332a32;color:#d9c6a3;font-size:13px}.progress{height:8px;background:#463745;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold)}@media(max-width:650px){.wrap{padding:9px}.split{grid-template-columns:1fr}.panel{padding:10px}.nav button{font-size:13px;padding:7px}.actions button{font-size:13px}}@media print{body{background:#fff;color:#111}.wrap{max-width:none}.header,.nav,.actions,.footer,button{display:none!important}.panel,.card,.stat{background:white;color:#111;border-color:#aaa;break-inside:avoid}.panel h2,.card h3,.stat strong{color:#222}.hint,small{color:#444}}
</style></head>
<body><div class="wrap" id="app">
<header class="header"><div class="brand"><h1>⚜ MUNDUS</h1><small>Codex de Personagens · Edição XIII</small></div><div class="actions"><button id="newCharacter">＋ Personagem</button><button class="secondary" id="saveButton">Salvar</button><button class="secondary" id="exportButton">Exportar JSON</button><button class="secondary" id="importButton">Importar</button><button class="secondary" id="printButton">Imprimir</button></div></header>
<div id="characterBar" class="row" style="margin-top:12px"></div><nav class="nav" id="nav"></nav><main id="main"></main><div class="footer">Autosave neste navegador · Exporte um backup para guardar seus personagens em outro dispositivo.</div></div>
<script>
(()=>{'use strict';
const STORE='mundus-codex-github-v1';const $=s=>document.querySelector(s);const ATTR=['FOR','DES','VIG','SAB','INT','CAR'];
const GROUPS={Combatente:['Guerreiro','Bucaneiro','Cavaleiro','Caçador','Bárbaro','Lutador'],Arcano:['Mago','Feiticeiro','Bruxo','Necromante','Clérigo','Tecelão Astral'],Especialista:['Ladino','Inventor','Druida','Domador','Alquimista','Estrategista'],TrilhasAdicionais:['Cartógrafo do Impossível','Guardião do Limiar','Maquinista de Relíquias','Arauto da Aurora Longa','Diplomata dos Ecos','Peregrino Abissal']};
const TRAIL_ATTR={'Guerreiro':'FOR/DES','Bucaneiro':'DES/CAR','Cavaleiro':'VIG/CAR','Caçador':'DES/SAB','Bárbaro':'FOR/VIG','Lutador':'FOR/DES','Mago':'INT/SAB','Feiticeiro':'CAR/VIG','Bruxo':'CAR/INT','Necromante':'INT/SAB','Clérigo':'SAB/CAR','Tecelão Astral':'INT/DES','Ladino':'DES/INT','Inventor':'INT/DES','Druida':'SAB/VIG','Domador':'SAB/CAR','Alquimista':'INT/SAB','Estrategista':'INT/CAR','Cartógrafo do Impossível':'INT/SAB','Guardião do Limiar':'VIG/SAB','Maquinista de Relíquias':'INT/DES','Arauto da Aurora Longa':'CAR/SAB','Diplomata dos Ecos':'CAR/SAB','Peregrino Abissal':'VIG/SAB'};
const RACES=[['Humano','+2 CAR · +1 INT · −1 VIG','Versatilidade; Determinação','Dhampir; Lobisomem'],['Parasita','+2 VIG · +1 INT · −1 CAR','Adaptação orgânica','Symbionte; Anti; Carnificia; Riot; Tanque'],['Ghoul','+2 DES · +1 VIG · −1 SAB','Kakuhou; Kagune; regeneração RC limitada','Meio-Ghoul; Meio-Humano; Ukaku; Koukaku; Rinkaku; Bikaku'],['Dragão','+2 FOR · +1 CAR · −1 DES','Memória; presença; Palavras da Voz','Draconato; Dragonborn'],['Morto-vivo','+2 INT · +1 SAB · −1 CAR','Tenacidade','Lich; Hollow'],['Demônio','+2 CAR · +1 INT · −1 SAB','Afinidade infernal; resistência ao fogo comum','Imp; Cão Infernal; Goetia'],['Vampiro','Conferir livro','Características vampíricas','Conferir sub-raças'],['Lycan','Conferir livro','Linhagem lupina','Conferir sub-raças'],['Orc','Conferir livro','Características orcs','Conferir sub-raças'],['Fada','Conferir livro','Características feéricas','Conferir sub-raças'],['Anão','Conferir livro','Características anãs','Conferir sub-raças'],['Gigante','Conferir livro','Características gigantes','Conferir sub-raças'],['Vastaya','Conferir livro','Linhagem Vastaya','Conferir sub-raças'],['Kitsune','Conferir livro','Linhagem Kitsune','Conferir sub-raças'],['Bestial','Conferir livro','10 afinidades','Conferir sub-raças'],['Aurídeos','Conferir livro','Traços Aurídeos','Conferir sub-raças'],['Nacarinos','Conferir livro','Traços Nacarinos','Conferir sub-raças'],['Ecosforjados','Conferir livro','Traços Ecosforjados','Conferir sub-raças'],['Penumbrais','Conferir livro','Traços Penumbrais','Conferir sub-raças']];
const SKILLS=['Acrobacia','Arcanismo','Atletismo','Atuação','Cavalgar','Diplomacia','Furtividade','História','Intimidação','Investigação','Intuição','Ladinagem','Luta','Medicina','Natureza','Ofício','Percepção','Pontaria','Religião','Resistência','Sobrevivência','Tecnologia Arcana','Fortitude','Reflexos','Vontade','Conhecimento'];
const SKILL_ATTR={'Acrobacia':'DES','Arcanismo':'INT','Atletismo':'FOR','Atuação':'CAR','Cavalgar':'DES','Diplomacia':'CAR','Furtividade':'DES','História':'INT','Intimidação':'CAR','Investigação':'INT','Intuição':'SAB','Ladinagem':'DES','Luta':'FOR','Medicina':'SAB','Natureza':'SAB','Ofício':'INT','Percepção':'SAB','Pontaria':'DES','Religião':'SAB','Resistência':'VIG','Sobrevivência':'SAB','Tecnologia Arcana':'INT','Fortitude':'VIG','Reflexos':'DES','Vontade':'SAB','Conhecimento':'INT'};
const PROF=[[1,4,2],[5,9,3],[10,19,4],[20,34,5],[35,49,6],[50,74,7],[75,99,8],[100,199,9],[200,999,10]];const MILESTONES=[5,10,15,20,35,50,75,100,150,200];
function blank(){return {name:'',player:'',level:1,xp:0,race:'',subrace:'',origin:'',blessing:'',classGroup:'',trail:'',trail2:'',specialization:'',attributes:{FOR:8,DES:8,VIG:8,SAB:8,INT:8,CAR:8},racial:{},resources:{pv:0,pvmax:0,vigor:0,vigormax:0,mana:0,manamax:0,ca:10,dt:10},skills:{},abilities:[],passives:[],talents:[],equipment:[],inventory:[],notes:''}}
let state;try{state=JSON.parse(localStorage.getItem(STORE))||{characters:[blank()],active:0,catalog:[]}}catch{state={characters:[blank()],active:0,catalog:[]}}if(!state.characters?.length)state.characters=[blank()];state.catalog ||= [];let page='Ficha';
const c=()=>state.characters[state.active];const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const mod=n=>Math.floor((Number(n)-10)/2);const prof=l=>(PROF.find(r=>l>=r[0]&&l<=r[1])||PROF.at(-1))[2];const effective=a=>Number(c().attributes[a]||0)+Number(c().racial[a]||0);
function racial(r){return ({Humano:{CAR:2,INT:1,VIG:-1},Parasita:{VIG:2,INT:1,CAR:-1},Ghoul:{DES:2,VIG:1,SAB:-1},Dragão:{FOR:2,CAR:1,DES:-1},'Morto-vivo':{INT:2,SAB:1,CAR:-1},Demônio:{CAR:2,INT:1,SAB:-1}})[r]||{}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));$('#saveButton').textContent='Salvo ✓';setTimeout(()=>$('#saveButton').textContent='Salvar',1000)}
function download(obj,name){let url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function input(label,path,value,type='text'){return `<div class="field"><label>${label}</label><input data-path="${path}" type="${type}" value="${esc(value)}"></div>`}function select(label,path,values,value){return `<div class="field"><label>${label}</label><select data-path="${path}"><option value="">— Selecionar —</option>${values.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}function area(label,path,value){return `<div class="field"><label>${label}</label><textarea rows="3" data-path="${path}">${esc(value)}</textarea></div>`}function stat(label,value,desc=''){return `<div class="stat"><small>${label}</small><strong>${value}</strong><small>${desc}</small></div>`}function panel(title,html){return `<section class="panel"><h2>${title}</h2>${html}</section>`}
function nav(){let pages=['Ficha','Raças','Classes e Trilhas','Habilidades','Passivas','Talentos','Perícias','Equipamentos','Resumo','Biblioteca'];$('#nav').innerHTML=pages.map(t=>`<button data-page="${t}" class="${page===t?'active':''}">${t}</button>`).join('');$('#nav').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#characterBar').innerHTML=`<label>Personagem ativo</label><select id="characterSelect">${state.characters.map((ch,i)=>`<option value="${i}" ${i===state.active?'selected':''}>${esc(ch.name||`Personagem ${i+1}`)} · Nv ${ch.level||1}</option>`).join('')}</select><button class="danger" id="deleteCharacter">Excluir personagem</button>`;$('#characterSelect').onchange=e=>{state.active=Number(e.target.value);save();render()};$('#deleteCharacter').onclick=()=>{if(state.characters.length===1){alert('Mantenha pelo menos um personagem.');return}if(confirm('Excluir este personagem?')){state.characters.splice(state.active,1);state.active=Math.max(0,state.active-1);save();render()}}}
function record(it,k,i){return `<div class="record"><div class="row"><b>${esc(it.name||'Registro sem nome')}</b><span class="pill">${esc(it.type||k)}</span><span class="pill">${esc(it.trail||it.class||'')}</span><button class="secondary" data-addfrom="${k}" data-i="${i}">Adicionar à ficha</button><button class="danger" data-delete="${k}" data-i="${i}">Excluir</button></div><p>${esc(it.description||it.effect||'Sem descrição')}</p><div class="meta">${esc([it.circle,it.cost,it.action,it.range,it.requirements].filter(Boolean).join(' · '))}</div></div>`}
function itemrow(it,k,i){return `<div class="card"><div class="row"><b>${esc(it.name||'Item')}</b><button class="danger" data-delete="${k}" data-i="${i}">Excluir</button></div><p>${esc(it.description||'')}</p>${input('Quantidade',`${k}.${i}.quantity`,it.quantity||1,'number')}</div>`}
function render(){nav();let x=c(),html='';if(page==='Ficha'){
html=panel('Identificação',`<div class="grid">${input('Nome','name',x.name)}${input('Jogador','player',x.player)}${input('Nível (1–200)','level',x.level,'number')}${input('Experiência','xp',x.xp,'number')}${select('Raça','race',RACES.map(r=>r[0]),x.race)}${input('Sub-raça / linhagem','subrace',x.subrace)}${input('Origem','origin',x.origin)}${input('Bênção','blessing',x.blessing)}${select('Grupo de classe','classGroup',['Combatente','Arcano','Especialista'],x.classGroup)}${select('Trilha principal','trail',GROUPS[x.classGroup]||Object.values(GROUPS).flat(),x.trail)}${select('Segunda trilha (nível 35+)','trail2',Object.values(GROUPS).flat().filter(t=>t!==x.trail),x.trail2)}${input('Especialização','specialization',x.specialization)}</div><p class="hint">Bônus raciais conhecidos aplicam automaticamente. Sub-raça não acumula um segundo pacote de bônus. A segunda trilha está liberada a partir do nível 35.</p>`)+panel('Atributos',`<div class="grid">${ATTR.map(a=>`<div class="stat"><label>${a}</label><input data-attr="${a}" type="number" min="1" max="30" value="${x.attributes[a]}"><strong>${effective(a)} (${mod(effective(a))>=0?'+':''}${mod(effective(a))})</strong><small>Bônus racial ${Number(x.racial[a]||0)>=0?'+':''}${x.racial[a]||0}</small></div>`).join('')}</div><div class="notice">Compra de atributos: sistema de 27 pontos. A tabela de custos ainda precisa ser conferida na edição XIII; por enquanto os valores podem ser editados livremente e não há validação de orçamento.</div>`)+panel('Recursos e defesa',`<div class="grid">${input('PV atual','resources.pv',x.resources.pv,'number')}${input('PV máximo','resources.pvmax',x.resources.pvmax,'number')}${input('Vigor atual','resources.vigor',x.resources.vigor,'number')}${input('Vigor máximo','resources.vigormax',x.resources.vigormax,'number')}${input('Mana atual','resources.mana',x.resources.mana,'number')}${input('Mana máximo','resources.manamax',x.resources.manamax,'number')}${input('CA','resources.ca',x.resources.ca,'number')}${input('DT','resources.dt',x.resources.dt,'number')}</div>`)+panel('Progressão',`<div class="grid">${stat('Proficiência','+'+prof(x.level))}${stat('Nível',x.level)}${stat('Marcos seguintes',MILESTONES.filter(n=>n>x.level).slice(0,4).join(' · ')||'200')}</div>`)+panel('Anotações',area('Notas','notes',x.notes));
}else if(page==='Raças'){html=panel('Catálogo de raças',RACES.map(r=>`<div class="card"><h3>${r[0]}</h3><span class="pill">${r[1]}</span><p>${r[2]}</p><small>${r[3]}</small></div>`).join('')+`<p class="notice">Os bônus das seis raças listadas foram inseridos conforme a revisão anterior. As demais entradas estão como índice, aguardando conferência do PDF para evitar regras inventadas.</p>`)}
else if(page==='Classes e Trilhas'){html=panel('Classes e trilhas',Object.entries(GROUPS).map(([g,ls])=>`<div class="card"><h3>${g}</h3>${ls.map(t=>`<p><b>${t}</b> <span class="pill">${TRAIL_ATTR[t]||'Atributos a confirmar'}</span></p>`).join('')}</div>`).join(''))}
else if(['Habilidades','Passivas','Talentos'].includes(page)){let k={Habilidades:'abilities',Passivas:'passives',Talentos:'talents'}[page];html=panel(page,`<div class="row"><button data-add="${k}">＋ Novo registro</button><input class="search" id="searchRecords" placeholder="Pesquisar por nome, trilha ou requisito"></div><p class="notice">O catálogo oficial precisa ser transcrito e conferido no livro. Esta área aceita conteúdo manual/importado sem apresentar placeholders como regras oficiais.</p><div class="list">${x[k].map((it,i)=>record(it,k,i)).join('')}</div>`)}
else if(page==='Perícias'){html=panel('Perícias',`<p class="hint">Treinado: 1× proficiência. Expert: 2× proficiência. Especialização é registrada para conferência das regras.</p><div class="grid">${SKILLS.map(s=>`<div class="card"><b>${s}</b><div class="field"><select data-skill="${s}"><option value="">Não treinado</option><option value="trained" ${x.skills[s]==='trained'?'selected':''}>Treinado</option><option value="expert" ${x.skills[s]==='expert'?'selected':''}>Expert</option><option value="special" ${x.skills[s]==='special'?'selected':''}>Especialização</option></select></div><small>Mod. ${mod(effective(SKILL_ATTR[s]||'INT'))} · Prof. +${x.skills[s]==='expert'?prof(x.level)*2:x.skills[s]?prof(x.level):0}</small></div>`).join('')}</div>`)}
else if(page==='Equipamentos'){html=panel('Equipamentos',`<div class="row"><button data-add="equipment">＋ Equipamento</button><button data-add="inventory">＋ Item</button></div><div class="split"><div><h3>Equipado</h3>${x.equipment.map((it,i)=>itemrow(it,'equipment',i)).join('')}</div><div><h3>Inventário</h3>${x.inventory.map((it,i)=>itemrow(it,'inventory',i)).join('')}</div></div>`)}
else if(page==='Resumo'){html=panel('Resumo',`<div class="grid">${stat('Personagem',esc(x.name||'Sem nome'))}${stat('Nível',x.level)}${stat('Raça',x.race||'—')}${stat('Classe',x.classGroup||'—')}${stat('Trilha',x.trail||'—')}${stat('PV',x.resources.pv+'/'+x.resources.pvmax)}${stat('Vigor',x.resources.vigor+'/'+x.resources.vigormax)}${stat('Mana',x.resources.mana+'/'+x.resources.manamax)}${stat('CA',x.resources.ca)}${stat('Proficiência','+'+prof(x.level))}${ATTR.map(a=>stat(a,effective(a),`Mod. ${mod(effective(a))}`)).join('')}</div><h3>Habilidades</h3>${x.abilities.map(it=>`<p>• ${esc(it.name)}</p>`).join('')}<h3>Passivas</h3>${x.passives.map(it=>`<p>• ${esc(it.name)}</p>`).join('')}<h3>Talentos</h3>${x.talents.map(it=>`<p>• ${esc(it.name)}</p>`).join('')}`)}
else{html=panel('Biblioteca de conteúdo',`<p>Importe ou registre talentos, habilidades, passivas, itens e regras verificadas. A biblioteca fica separada da ficha de personagem.</p><div class="row"><button id="catalogTemplate">Modelo JSON</button><button id="catalogAdd">＋ Registro</button><input class="search" id="catalogSearch" placeholder="Pesquisar biblioteca"></div><div class="list">${state.catalog.map((it,i)=>record(it,'catalog',i)).join('')}</div>`)}$('#main').innerHTML=html;bind()}
function bind(){ $('#main').querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>{let parts=el.dataset.path.split('.'),o=c();parts.forEach((p,i)=>{if(i===parts.length-1)o[p]=el.type==='number'?Number(el.value):el.value;else o=o[p]});if(parts[0]==='race')c().racial=racial(c().race);if(parts[0]==='level'&&c().level<35)c().trail2='';if(parts[0]==='classGroup')c().trail='';save();render()});$('#main').querySelectorAll('[data-attr]').forEach(el=>el.onchange=()=>{c().attributes[el.dataset.attr]=Number(el.value);save();render()});$('#main').querySelectorAll('[data-skill]').forEach(el=>el.onchange=()=>{c().skills[el.dataset.skill]=el.value;save();render()});$('#main').querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{let k=el.dataset.add;if(k==='equipment'||k==='inventory')c()[k].push({name:'Item novo',quantity:1,description:''});else c()[k].push({name:'Registro novo',type:k,description:'',requirements:'',cost:'',action:'',range:'',circle:'',trail:''});save();render()});$('#main').querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{let k=el.dataset.delete,i=+el.dataset.i;if(k==='catalog')state.catalog.splice(i,1);else c()[k].splice(i,1);save();render()});$('#main').querySelectorAll('[data-addfrom]').forEach(el=>el.onclick=()=>{let k=el.dataset.addfrom,i=+el.dataset.i,src=k==='catalog'?state.catalog[i]:c()[k][i],dest=k==='catalog'?'abilities':k;c()[dest].push({...src});save();render()});let sr=$('#searchRecords');if(sr)sr.oninput=()=>$('#main').querySelectorAll('.record').forEach(el=>el.classList.toggle('hide',!el.textContent.toLowerCase().includes(sr.value.toLowerCase())));let cs=$('#catalogSearch');if(cs)cs.oninput=()=>$('#main').querySelectorAll('.record').forEach(el=>el.classList.toggle('hide',!el.textContent.toLowerCase().includes(cs.value.toLowerCase())));if($('#catalogTemplate'))$('#catalogTemplate').onclick=()=>download({format:'mundus-catalog-v1',records:[]},'mundus-catalogo-modelo.json');if($('#catalogAdd'))$('#catalogAdd').onclick=()=>{state.catalog.push({name:'Novo registro',type:'Talento',description:''});save();render()}}
$('#newCharacter').onclick=()=>{state.characters.push(blank());state.active=state.characters.length-1;save();render()};$('#saveButton').onclick=save;$('#exportButton').onclick=()=>download(state,'mundus-backup.json');$('#importButton').onclick=()=>{let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{let file=f.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(d.characters)state=d;else if(d.format==='mundus-catalog-v1')state.catalog=d.records||[];else throw Error('format');if(!state.characters?.length)state.characters=[blank()];state.active=Math.min(state.active||0,state.characters.length-1);save();render()}catch{alert('Arquivo JSON inválido ou formato não reconhecido.')}};reader.readAsText(file)};f.click()};$('#printButton').onclick=()=>window.print();render();
})();
</script></body></html>
